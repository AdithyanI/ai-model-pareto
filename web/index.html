<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Two charts, one object &middot; the AI model trade-off in three dimensions</title>
    <meta
      name="description"
      content="Intelligence, cost and speed are usually shown as two flat charts, each missing an axis. Name a response-time budget and the winners change — and some genuinely optimal models appear on neither published chart."
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="app">
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <h1>Two charts, one object</h1>
          <p class="brand-sub">
            Intelligence, cost and speed are one trade-off. Each published chart drops an axis.
          </p>
        </div>
        <div id="views" class="views" role="group" aria-label="Chart"></div>
        <div class="tools">
          <label class="control">
            <span>Speed</span>
            <select id="latency"></select>
          </label>
          <label class="control">
            <span>Show</span>
            <select id="scope">
              <option value="representative">Best host per model</option>
              <option value="all">Every model and host</option>
              <option value="open">Open weights only</option>
            </select>
          </label>
          <a class="read-link" href="./read.html">How this works &rarr;</a>
        </div>
      </header>

      <main class="stage" aria-label="Model trade-off chart">
        <p id="view-caption" class="view-caption"></p>

        <div class="plot-area">
          <div class="canvas-wrap">
            <canvas id="plot" role="img" aria-label="Loading chart"></canvas>
            <div id="tooltip" class="tooltip" hidden></div>
          </div>
          <aside id="detail" class="detail" aria-live="polite" hidden></aside>
        </div>

        <footer class="stage-foot">
          <div id="legend" class="legend"></div>
          <p class="hint">Click a point to see what beats it &middot; arrow keys change chart</p>
          <p id="meta" class="meta"></p>
        </footer>
      </main>
    </div>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>
